table:
  name: chefs
  schema: public
object_relationships:
  - name: address
    using:
      foreign_key_constraint_on:
        column: id
        table:
          name: addresses
          schema: public
array_relationships:
  - name: subscriptions
    using:
      foreign_key_constraint_on:
        column: assigned_chef_id
        table:
          name: subscriptions
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - only_veg_days
        - first_name
        - last_name
        - mobile
        - whatsapp
        - created_at
        - updated_at
        - id
      filter:
        subscriptions:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
