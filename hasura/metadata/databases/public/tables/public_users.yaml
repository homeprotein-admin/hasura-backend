table:
  name: users
  schema: public
object_relationships:
  - name: diet_type
    using:
      foreign_key_constraint_on: diet_preference
array_relationships:
  - name: addresses
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: addresses
          schema: public
  - name: orders
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: orders
          schema: public
  - name: subscriptions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: subscriptions
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - diet_preference
        - email
        - first_name
        - last_name
        - mobile
        - whatsapp
        - created_at
        - updated_at
        - id
      filter:
        id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - diet_preference
        - email
        - first_name
        - last_name
        - mobile
        - whatsapp
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
    comment: ""
