table:
  name: slot
  schema: public
array_relationships:
  - name: orders
    using:
      foreign_key_constraint_on:
        column: slot_id
        table:
          name: orders
          schema: public
  - name: subscriptions
    using:
      foreign_key_constraint_on:
        column: slot_id
        table:
          name: subscriptions
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - from
        - to
      filter:
        subscriptions:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
