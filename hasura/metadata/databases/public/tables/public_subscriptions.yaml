table:
  name: subscriptions
  schema: public
object_relationships:
  - name: chef
    using:
      foreign_key_constraint_on: assigned_chef_id
  - name: payment
    using:
      foreign_key_constraint_on: payment_id
  - name: slot
    using:
      foreign_key_constraint_on: slot_id
  - name: subscription_plan
    using:
      foreign_key_constraint_on: plan_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: orders
    using:
      foreign_key_constraint_on:
        column: subscription_id
        table:
          name: orders
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - end_date
        - start_date
        - amount_paid
        - plan_id
        - slot_id
        - created_at
        - updated_at
        - assigned_chef_id
        - id
        - payment_id
        - user_id
      filter:
        orders:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
