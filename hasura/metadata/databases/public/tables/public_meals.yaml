table:
  name: meals
  schema: public
object_relationships:
  - name: diet_type
    using:
      foreign_key_constraint_on: meal_type
array_relationships:
  - name: orders
    using:
      foreign_key_constraint_on:
        column: meal_id
        table:
          name: orders
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - carbs
        - description
        - fat
        - fiber
        - image
        - kcal
        - meal_type
        - name
        - protein
        - created_at
        - updated_at
      filter:
        orders:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
